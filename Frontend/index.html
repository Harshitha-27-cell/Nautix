<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGO Ocean Data Discovery - Auth Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background Ocean Grid & Glows -->
    <div class="ocean-bg">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="ocean-grid"></div>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <!-- Logo & Title -->
        <div class="auth-header">
            <div class="logo-icon">
                <i class="fa-solid fa-anchor"></i>
            </div>
            <h1>ARGO Chatbot</h1>
            <p>Ocean Data Discovery & Visualization Portal</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Register
                </button>
            </div>

            <!-- Error/Info Alert Box -->
            <div id="alert-box" class="alert hidden">
                <span id="alert-message">Error message goes here</span>
                <button class="close-alert" onclick="hideAlert()">&times;</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="login-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="login-email" placeholder="name@domain.com" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password')">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="login-btn">
                    <span>Login Access</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="reg-name"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" required autocomplete="name">
                </div>
                <div class="input-group">
                    <label for="reg-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@domain.com" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="reg-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="Min. 8 characters" required autocomplete="new-password" minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg-password')">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="register-btn">
                    <span>Initialize Account</span> <i class="fa-solid fa-circle-check"></i>
                </button>
            </form>
        </div>

        <div class="auth-footer">
            <p>Protected by Secure JWT Authentication with refresh token rotations.</p>
        </div>
    </div>

    <!-- Auth Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
